<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="css/style.css" />
    <link href="https://fonts.cdnfonts.com/css/brick-sans" rel="stylesheet" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FUTURE//WALKMAN</title>
  </head>
  <body>
    <header>
      <!-- logo -->
    </header>
    <main>
      <div class="container">
        <h1>FUTURE//WALKMAN</h1>
        <br />
        <section class="nav">
          <a href="#playlist"><h4>PLAYLIST</h4></a>

          <a href="#download"><h4>DOWNLOAD</h4></a>
        </section>

        <section class="player">
          <div class="track-container">
            <img src="images/track.png" alt="Walkman" class="track" />
            <img
              src="images/track-midpoint - file.png"
              alt="Walkman"
              class="track-midpoint"
            />
            <button class="Next">
              <img src="images/next.png" alt="Next" />
            </button>
            <button class="Previous">
              <img src="images/next.png" alt="Previous" />
            </button>

            <button class="Play">
              <img src="images/player.png" alt="Play" />
            </button>

            <h2 class="playlist-name">PLAYLIST NAME</h2>
            <img src="images/stline.png" alt="Line" class="line" />
          </div>
        </section>
      </div>
    </main>

    <footer>
      <p>© 2024 FUTURE//WALKMAN. All rights reserved.</p>
    </footer>
  </body>
</html>
